syntax = "proto3";
package actuator;

service Actuator {
  rpc Execute (ActuateRequest) returns (ActuateResponse);
}

enum ActuationType {
  UNKNOWN = 0;
  CLICK = 1;
  DRAG = 2;
  TYPE = 3;
}

message ActuateRequest {
  ActuationType type = 1;
  int32 x = 2;
  int32 y = 3;
  string text = 4;
}

message ActuateResponse {
  bool ok = 1;
  string message = 2;
}
